name: Android debug build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Gradle Wrapper is executable
        run: test -x ./gradlew
        working-directory: MeltingFaceRainAndroid

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: List installed Android SDK packages
        run: sdkmanager --list_installed

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: MeltingFaceRainAndroid

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
        working-directory: MeltingFaceRainAndroid

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meltfall-live-debug-apk
          path: MeltingFaceRainAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
