# Meltfall Live release defaults
#
# Open this file in Notepad before building a release to change the values that
# new installs start with. These are build-time defaults, not live phone prefs.
#
# Valid values:
# drop_speed: integer 0..200
#   0   = stopped
#   50  = half speed
#   100 = normal speed
#   200 = double speed
#
# emoji_count: integer 0 or greater
#   No app-enforced maximum. Very high values can reduce battery life/FPS.
#
# emoji_size: integer 60..170
#   100 = normal size
#
# fps_limit: one of 0, 30, 45, 60
#   0 = unlimited
#
# show_fps: true or false
#   Debug-only. Release builds hide the FPS counter even if this is true.
drop_speed=100
emoji_count=240
emoji_size=100
fps_limit=0
show_fps=false
